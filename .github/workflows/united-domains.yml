# Lädt die Website bei jedem Push automatisch per SFTP auf den Webspace bei United Domains.
# Einmalig einrichten (GitHub → Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER   = access-….ud-webspace.de   (United-Domains-Portal → Webspace → SFTP-Zugangsdaten)
#   FTP_USERNAME = Benutzername von dort
#   FTP_PASSWORD = das dort gespeicherte SFTP-Passwort
# Zielordner auf dem Webspace: neusser-doner-pizza (mit der Domain verknüpfen). Ändern über die
# Variable FTP_ORDNER. Solange FTP_SERVER fehlt, läuft der Job durch, ohne etwas hochzuladen.
name: Auf United Domains hochladen

on:
  push:
    branches: [claude/peaceful-einstein-qj0d00, main]
  workflow_dispatch:

concurrency:
  group: united-domains
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten vorhanden?
        id: pruefen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "los=ja" >> "$GITHUB_OUTPUT"; else echo "FTP_SERVER fehlt – nichts hochgeladen."; fi

      - uses: actions/checkout@v4
        if: steps.pruefen.outputs.los == 'ja'

      - name: Hochladen (SFTP, Port 22)
        if: steps.pruefen.outputs.los == 'ja'
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BENUTZER: ${{ secrets.FTP_USERNAME }}
          PASSWORT: ${{ secrets.FTP_PASSWORD }}
          ORDNER: ${{ vars.FTP_ORDNER || 'neusser-doner-pizza' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$BENUTZER","$PASSWORT" -p 22 "sftp://$SERVER" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mkdir -p -f $ORDNER;
            mirror --reverse --delete --only-newer --parallel=4 --verbose=1 \
              --exclude-glob .git* --exclude-glob .git*/ --exclude .github/ \
              --exclude tools/ --exclude supabase/ --exclude data/quellen/ \
              --exclude-glob druck/*.html --exclude-glob README.md \
              ./ $ORDNER/;
            bye"
